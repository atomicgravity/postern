# Postern sshd integration — partial sshd_config drop-in.
#
# Install at /etc/ssh/sshd_config.d/10-postern.conf on distributions whose
# main sshd_config includes `Include /etc/ssh/sshd_config.d/*.conf` (Debian,
# Ubuntu, modern Fedora). On other layouts, append the directives below into
# your existing sshd_config — they are additive, not a full replacement.
#
# Prereqs the rest of your provisioning must arrange:
#
#   /etc/ssh/postern_ca.pub                       — broker's SSH CA public key
#   /etc/ssh/authorized_principals/engineer       — populated at boot by
#                                                   principals-init from the
#                                                   device hardware serial
#                                                   (contents: device-{serial}-operator)
#   /etc/ssh/authorized_principals/timefix        — same shape; contents:
#                                                   device-{serial}-timefix
#   `engineer` system user                        — real interactive shell;
#                                                   the name is convention,
#                                                   not mandate (see README)
#   `timefix` system user                         — unprivileged; must have
#                                                   a real shell (e.g. /bin/sh),
#                                                   NOT /usr/sbin/nologin —
#                                                   sshd runs the ForceCommand
#                                                   via the user's login shell
#                                                   (`shell -c '/usr/sbin/timefix-apply'`),
#                                                   so a nologin shell prints
#                                                   "This account is currently
#                                                   not available." and exits
#                                                   before the verifier runs
#   /usr/sbin/timefix-apply                       — unprivileged Go verifier
#   /usr/sbin/timefix-set-clock                   — privileged Go setter
#                                                   (cap_sys_time+ep). The
#                                                   verifier execs the setter
#                                                   after validating the JWS.
#                                                   See examples/on-device/timefix/
#                                                   for the install + setcap
#                                                   recipe.
#
# After installing this drop-in, validate config and reload sshd:
#
#   sudo sshd -t                                   # syntax + sanity check
#   sudo systemctl reload sshd                     # or `kill -HUP <sshd pid>`

# --- Trust + auth model ---

# Trust anchor for SSH certificate verification. Public key of the broker's
# Ed25519 SSH CA (KMS-backed in the v1 AWS reference deployment).
TrustedUserCAKeys /etc/ssh/postern_ca.pub

# Per-user principal allowlists. sshd consults this file when a cert presents,
# and admits the connection only if the cert's principal appears in the file
# for the target user. principals-init populates these files at boot.
AuthorizedPrincipalsFile /etc/ssh/authorized_principals/%u

# Force cert-only auth. Disables the conventional ~/.ssh/authorized_keys path
# so a stale or smuggled key cannot bypass the broker.
AuthorizedKeysFile none

# Baseline hardening. Adjust to your existing policy if any of these are
# already set elsewhere in your sshd_config.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

LogLevel VERBOSE

# --- engineer user: real shell ---

# The principal `device-{serial}-operator` admits a cert into this user.
# Local port forwards for `-L` debug tunnels back to the engineer's laptop;
# agent forwarding on (matches Postern CLI's ForwardAgent=yes default). No
# X11, no tunnel device.
Match User engineer
    AllowTcpForwarding local
    AllowAgentForwarding yes
    X11Forwarding no
    PermitTunnel no

# --- timefix user: forced-command recovery path ---

# The timefix cert is long-lived (~1970–3000) because it must work on devices
# whose clocks have drifted past the operator cert's normal validity window.
# Everything reachable through this user is the forced verifier binary, which
# reads a fresh in-memory nonce + a broker-signed time payload from stdin and
# updates the system clock. No shell, no TTY, no port forwards, no agent.
Match User timefix
    ForceCommand /usr/sbin/timefix-apply
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
